backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

locale: "es"

collections:
  - name: "courses"
    label: "Cursos"
    files:
      - name: "maquillaje"
        label: "Maquillaje profesional"
        file: "content/courses/maquillaje.json"
        fields:
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Bajada / descripción corta", name: "subtitle", widget: "text"}
          - {label: "Foto de portada", name: "hero_image", widget: "image"}
          - {label: "Duración", name: "duration", widget: "string"}
          - {label: "Modalidad", name: "modality", widget: "string"}
          - {label: "Certificación", name: "certification", widget: "string"}
          - {label: "Material incluido", name: "material", widget: "string"}
          - label: "¿Qué vas a aprender? (lista de puntos)"
            name: "checklist"
            widget: "list"
          - label: "Galería de fotos"
            name: "gallery"
            widget: "list"
            fields:
              - {label: "Foto", name: "image", widget: "image"}
              - {label: "Descripción de la foto", name: "alt", widget: "string", required: false}

      - name: "tocados"
        label: "Tocados artesanales"
